# Actualiza las noticias de la web cada 3 horas sin necesidad de servidor:
# descarga los RSS de los medios, genera noticias.json y lo sube a la rama
# gh-pages (la que publica GitHub Pages).
name: Actualizar noticias

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: true

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: codigo
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: web
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generar noticias.json
        run: node --experimental-strip-types codigo/scripts/noticias.mjs web/noticias.json
      - name: Publicar
        working-directory: web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || git commit -m "Noticias actualizadas"
          git push
